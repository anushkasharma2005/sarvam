<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cron.brief</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#c9d1d9; --mute:#7d8590;
          --green:#3fb950; --cyan:#58a6ff; --amber:#d29922; --red:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  .bar { display:flex; align-items:center; gap:8px; color:var(--mute); margin-bottom:20px; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .bar .title { margin-left:8px; }
  h1 { font-size:1.1rem; font-weight:600; margin:0 0 4px; color:var(--green); }
  h1::before { content:"$ "; color:var(--mute); }
  .sub { color:var(--mute); margin:0 0 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:16px; }
  .panel > h2 { margin:0; padding:8px 14px; font-size:.85rem; font-weight:500; color:var(--mute);
                border-bottom:1px solid var(--line); }
  .panel > h2::before { content:"// "; color:var(--cyan); }
  .panel .body { padding:14px; }
  button, select, input[type=text] { font:inherit; padding:6px 12px; border-radius:6px;
        border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--green); color:var(--green); }
  button.primary { border-color:var(--green); color:var(--green); }
  button:disabled { opacity:.45; cursor:wait; }
  input[type=text]:focus, select:focus { outline:1px solid var(--cyan); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .mute { color:var(--mute); }
  .ok { color:var(--green); } .err { color:var(--red); }
  #summary { white-space:pre-wrap; }
  ul { margin:0; padding-left:0; list-style:none; }
  li::before { content:"> "; color:var(--amber); }
  .event { border-top:1px dashed var(--line); padding:10px 0; }
  .event:first-child { border-top:0; padding-top:0; }
  a { color:var(--cyan); }
  .cursor::after { content:"▋"; color:var(--green); animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .you { color:var(--cyan); } .you::before { content:"you@cron.brief:~$ "; color:var(--mute); }
</style>
</head>
<body>
<main>
  <div class="bar">
    <span class="dot" style="background:#ff5f56"></span><span class="dot" style="background:#ffbd2e"></span><span class="dot" style="background:#27c93f"></span>
    <span class="title">cron.brief — zsh</span>
  </div>

  <h1>cron.brief --since=yesterday</h1>
  <p class="sub">Overnight email, summarized.</p>

  <div class="panel">
    <h2>sources</h2>
    <div class="body row">
      {% if connected %}
        <span class="ok">● gmail + calendar connected</span>
      {% else %}
        <span class="err">○ not connected</span>
        <a href="/auth"><button>connect google</button></a>
      {% endif %}
    </div>
  </div>

  <div class="row" style="margin-bottom:16px">
    <button class="primary" id="go">./generate</button>
    <select id="lang" title="Voice language">
      <option value="en-IN">en</option><option value="hi-IN">hi — हिन्दी</option>
      <option value="ta-IN">ta — தமிழ்</option><option value="te-IN">te — తెలుగు</option>
      <option value="kn-IN">kn — ಕನ್ನಡ</option><option value="ml-IN">ml — മലയാളം</option>
      <option value="bn-IN">bn — বাংলা</option><option value="mr-IN">mr — मराठी</option>
      <option value="gu-IN">gu — ગુજરાતી</option><option value="pa-IN">pa — ਪੰਜਾਬੀ</option>
    </select>
    <button id="play" disabled>▶ speak</button>
  </div>
  <div id="status" class="mute"></div>

  <div id="out" hidden>
    <div class="panel"><h2>summary</h2><div class="body"><div id="summary"></div><div class="mute" id="meta" style="margin-top:8px"></div></div></div>
    <div class="panel" id="replyCard"><h2>needs_reply</h2><div class="body"><ul id="reply"></ul></div></div>
    <div class="panel" id="evCard"><h2>events</h2><div class="body" id="events"></div></div>
  </div>

  <div class="panel">
    <h2>ask</h2>
    <div class="body">
      <div class="row">
        <input type="text" id="q" placeholder="what did I miss from..." style="flex:1;min-width:180px">
        <button id="mic">● rec</button>
        <button id="ask">run</button>
      </div>
      <p id="answer" style="margin:12px 0 0;white-space:pre-wrap"></p>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})}).then(r => r.json());
let voiceText = '';

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

$('go').onclick = async () => {
  $('go').disabled = true; $('status').className = 'mute cursor'; $('status').textContent = 'fetching mail, calling sarvam-105b ';
  const r = await post('/api/brief');
  $('go').disabled = false;
  if (r.error) { $('status').className = 'err'; $('status').textContent = 'error: ' + r.error; return; }
  $('status').className = ''; $('status').textContent = '';
  $('out').hidden = false;
  $('summary').textContent = r.summary;
  $('meta').textContent = '# ' + r.email_count + ' emails read';
  $('reply').innerHTML = (r.needs_reply || []).map(x => '<li>' + esc(x) + '</li>').join('') || '<li class="mute">nothing pending</li>';
  const evs = r.events || [];
  $('evCard').hidden = !evs.length;
  $('events').innerHTML = '';
  evs.forEach(ev => {
    const div = document.createElement('div'); div.className = 'event';
    div.innerHTML = '<b>' + esc(ev.title) + '</b><br><span class="mute">' + esc(ev.start.replace('T',' ')) + ' · from: ' + esc(ev.source || '') + '</span><br>';
    const b = document.createElement('button'); b.textContent = '+ add to calendar'; b.style.marginTop = '6px';
    b.onclick = async () => {
      b.disabled = true;
      const res = await post('/api/event', ev);
      if (res.error) { b.disabled = false; b.textContent = res.error; return; }
      b.outerHTML = '<a href="' + res.link + '" target="_blank" class="ok">✓ added — view</a>';
    };
    div.appendChild(b); $('events').appendChild(div);
  });
  voiceText = r.voice_summary || r.summary;
  $('play').disabled = false;
};

$('play').onclick = async () => {
  $('play').disabled = true;
  const r = await post('/api/tts', {text: voiceText, lang: $('lang').value});
  $('play').disabled = false;
  if (r.audio) new Audio('data:audio/wav;base64,' + r.audio).play();
  else { $('status').className = 'err'; $('status').textContent = 'error: voice failed'; }
};

$('ask').onclick = async () => {
  const q = $('q').value.trim();
  if (!q) return;
  $('answer').className = 'cursor'; $('answer').textContent = '';
  const r = await post('/api/ask', {question: q});
  $('answer').className = ''; $('answer').textContent = r.answer || r.error || '';
};
$('q').onkeydown = e => { if (e.key === 'Enter') $('ask').click(); };

let rec, chunks = [];
$('mic').onclick = async () => {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  rec = new MediaRecorder(stream); chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    $('mic').textContent = '● rec';
    const fd = new FormData(); fd.append('audio', new Blob(chunks, {type: rec.mimeType}), 'q.webm');
    const r = await fetch('/api/stt', {method:'POST', body: fd}).then(r => r.json());
    if (r.text) { $('q').value = r.text; $('ask').click(); }
  };
  rec.start(); $('mic').textContent = '■ stop';
};
</script>
</body>
</html>
